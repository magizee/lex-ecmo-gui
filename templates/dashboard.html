<!DOCTYPE html>
<html>
<head>
    <title>Ecmo Simulator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
</head>
<body>
    <div class="nav">
        <div class="icons">
            <span class="icon"><i class="fa-solid fa-lungs"></i></span>
            <span class="icon"><i class="fa-solid fa-lock"></i></span>
            <button id="exit-button" class="exit-button" onclick="exitApp()"> </button>

        </div>
        <!-- ALERT -->
        <div id="alert-text" class="alert-text">
            {{ banner_text or "All systems nominal" }}
        </div>

        <div class="time" id="current-time"></div>
    </div>

  
    <div style="position:absolute; top:0; left:0; width:800px; height:475px; background-color:rgba(255, 0, 0, 0.163); z-index:-1;"></div>
    <div class="content">
        <div class="container">
        <table>
            <tr>
                <td id="cell-flow-rate" colspan="3">
                    <p class="circled"><span>V&#775;</span></p>
                    <span class="variable" id="flow-rate">{{flow_rate }}</span>
                    <span class="unit">lpm</span>
                </td>
                <td id="cell-rpm" colspan="3">
                    <p class="circled"><span>&#8635;</span></p>
                    <span class="variable" id="rpm">{{ rpm }}</span>
                    <p class="rpm-shadow">000000</p>
                    <span class="unit">rpm</span>
                </td>
            </tr>
            <tr>
                <td id="cell-p-ven" colspan="3">
                    <p class="circled"><span>p<sub>Ven</sub></span></p>
                    <span class="variable" id="p-ven">{{ p_ven }}</span>
                    <span class="unit">mmHg</span>
                </td>
                <td id="cell-p-art" colspan="3">
                    <p class="circled"><span>p<sub>Art</sub></span></p>
                    <span class="variable" id="p-art">{{ p_art }}</span>
                    <span class="unit">mmHg</span>
                </td>
            </tr>
            <tr>
                <td id="cell-p-int" colspan="3">
                    <p class="circled"><span>p<sub>Int</sub></span></p>
                    <span class="variable" id="p-int">{{ p_int }}</span>
                    <span class="unit">mmHg</span>
                </td>
                <td id="cell-t-art" colspan="3">
                    <p class="circled"><span>T<sub>Art</sub></span></p>
                    <span class="variable" id="t-art">{{ t_art }}</span>
                    <span class="unit">&deg;C</span>
                </td>
            </tr>
            <tr>
                <td id="cell-delta-p" colspan="3">
                    <p class="circled"><span>&Delta;</span>p</p>
                    <span class="variable" id="delta-p">{{ delta_p }}</span>
                    <span class="unit">mmHg</span>
                </td>
                <td id="cell-svo2" colspan="3">
                    <p class="circled"><span>S<sub>v</sub>O<sub>2</sub></span></p>
                    <span class="variable" id="svo2">{{ svo2 }}</span>
                    <span class="unit">%</span>
                </td>
            </tr>
            <tr class="last-row">
                <td><button onclick="location.href='/'"><i class="fas fa-home"></i></button></td>
                <td><button onclick="location.href='/dashboard'"><i class="fa-solid fa-table-cells-large"></i></button></td>
                <td><button class="disabled" disabled><i class="fa-solid fa-vials"></i></button></td>
                <td><button class="disabled" disabled><i class="fa-solid fa-truck-medical"></i></button></td>
                <td><button class="disabled" disabled><i class="fa-solid fa-link"></i></button></td>
                <td><button class="disabled" disabled><i class="fa-regular fa-clock"></i></button></td>
            </tr>
        </table>
        <div class="side-buttons">
            <div class="connected-buttons">
                <button onclick="location.href='/'"><i class="fas fa-home"></i></button>
                <button onclick="location.href='/dashboard'"><i class="fa-solid fa-grip"></i></button>
            </div>
            <button class="circle-button"><i class="fa-solid fa-s"></i>  <i class="fa-solid fa-triangle-exclamation"></i></button>
            <button class="circle-button disabled" disabled><i class="fa-solid fa-link"></i></button>
            <button class="rect-button"><i class="fa-solid fa-battery-full"></i></button>
        </div>
    </div>
    </div>
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <div id="modal-text"></div>
        </div>
    </div>
    
    <div class="control-panel">
        <div class="circle-container">
            <div class="circle" id="joystickKnob">
            CARDIOHELP
            <div class="marker"></div>
            </div>
        </div>
    </div>
  <script>
    (() => {
      // -------- Config & helpers --------
      const POLL_MS = 1000;
      const RPM_POST_MIN_INTERVAL = 100;
      const STATUS_CLASSES = ["status-0","status-1","status-2"]; // 0=safe,1=yellow,2=red

      const $ = (id) => document.getElementById(id);
      const navEl = document.querySelector(".nav");

      // (Removed LABELS — not needed when server provides banner_text)

      // Map: [DOM id, payload key]
      const VALUE_FIELDS = [
        ["flow-rate", "flow_rate"],
        ["p-ven",     "p_ven"],
        ["p-int",     "p_int"],
        ["p-art",     "p_art"],
        ["t-art",     "t_art"],
        ["svo2",      "svo2"],
        ["delta-p",   "delta_p"],
        ["rpm",       "rpm"],
      ];

      // Map: [cell id, safety_status key]
      const STATUS_TARGETS = [
        ["cell-flow-rate", "flow_rate"],
        ["cell-p-ven",     "p_ven"],
        ["cell-p-int",     "p_int"],
        ["cell-p-art",     "p_art"],
        ["cell-t-art",     "t_art"],
        ["cell-svo2",      "svo2"],
        ["cell-delta-p",   "delta_p"],
      ];

      async function fetchJSON(url, options = {}) {
        try {
          const res = await fetch(url, { cache: "no-store", ...options });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (err) {
          console.error(`fetchJSON ${url} failed:`, err);
          return null;
        }
      }

      // show 0 correctly; only use "—" for null/undefined
      function setText(id, value) {
        const el = $(id);
        if (!el) return;
        el.textContent = (value === null || value === undefined) ? "—" : String(value);
      }

      function removeStatuses(el) {
        STATUS_CLASSES.forEach(c => el.classList.remove(c));
      }

      function applyCircleStatus(cellId, status){
        const circle = document.querySelector(`#${cellId} .circled`);
        const s = (status === 1 || status === 2) ? status : 0;
        if (!circle) return;
        removeStatuses(circle);
        circle.classList.add(STATUS_CLASSES[s]);
      }

      function applyValueStatus(cellId, status){
        const val = document.querySelector(`#${cellId} .variable`);
        const s = (status === 1 || status === 2) ? status : 0;
        if (!val) return;
        removeStatuses(val);
        val.classList.add(STATUS_CLASSES[s]);
      }

      function setNavSeverity(severity /* 0/1/2 */, ss) {
        if (!navEl) return;
        removeStatuses(navEl);
        const sev = (severity === 1 || severity === 2) ? severity : 0;
        navEl.classList.add(STATUS_CLASSES[sev]);
        // NOTE: We no longer set alert text here; it’s rendered by the server into #alert-text.  // <--
      }  // <----- IMPORTANT: close the function (this was missing when you commented code)

      // -------- Polling loop --------
      async function pollUpdate(){
        const data = await fetchJSON("/update");
        if (!data) return;

        // Update numbers
        for (const [id, key] of VALUE_FIELDS) setText(id, data[key]);

        // Apply tri-state to circle + value text
        const ss = data.safety_status || {};
        let maxSeverity = 0;
        for (const [cellId, key] of STATUS_TARGETS){
          const s = ss[key] ?? 0;
          applyCircleStatus(cellId, s);
          applyValueStatus(cellId, s);
          if (s > maxSeverity) maxSeverity = s;

          const alertTextEl = $("alert-text");
          const bt = (data.banner_text && String(data.banner_text).trim())
            ? data.banner_text
            : "All systems nominal";

          if (alertTextEl && alertTextEl.textContent !== bt) {
            alertTextEl.textContent = bt;
          }
        }

        // Nav color from most severe (unchanged behavior)
        setNavSeverity(maxSeverity, ss);

        // If you ever decide to include `banner_text` in /update, you can optionally refresh it here:
        // const bt = data.banner_text;
        // const alertTextEl = $("alert-text");
        // if (alertTextEl && typeof bt === "string") alertTextEl.textContent = bt;
      }

      // -------- Clock --------
      function updateTime() {
        const el = $("current-time");
        if (!el) return;
        const now = new Date();
        el.textContent = now.toLocaleTimeString([], {
          hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
        });
      }

      // -------- Modal + Exit (globals for inline handlers) --------
      window.showPopup = function(message) {
        setText("modal-text", `${message} Information`);
        const modal = $("myModal");
        if (modal) modal.style.display = "block";
      };
      window.closePopup = function() {
        const modal = $("myModal");
        if (modal) modal.style.display = "none";
      };
      window.exitApp = function() {
        fetch("/exit", { method: "POST" }).catch(e => console.error("exitApp failed:", e));
      };

      // -------- Joystick (unchanged) --------
      (function initJoystick() {
        const knob = $("joystickKnob");
        if (!knob) return;

        let isDragging = false;
        let lastAngle = null;
        let totalRotation = 0;
        const baseRPM = 4000;
        let lastSent = 0;

        function getAngle(e, element) {
          const rect = element.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const t = (e.touches && e.touches[0]) || e;
          return Math.atan2(t.clientY - cy, t.clientX - cx) * (180 / Math.PI);
        }
        function updateKnobRotation(angle) { knob.style.transform = `rotate(${angle}deg)`; }
        function sendRPMToServer(rpm) {
          const now = Date.now();
          if (now - lastSent < RPM_POST_MIN_INTERVAL) return;
          lastSent = now;
          fetch("/joystick-data", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rpm })
          }).catch(e => console.error("sendRPMToServer failed:", e));
        }
        function startDrag(e) { isDragging = true; lastAngle = getAngle(e, knob); e.preventDefault(); }
        function onDrag(e) {
          if (!isDragging) return;
          e.preventDefault();
          const newAngle = getAngle(e, knob);
          let delta = newAngle - lastAngle;
          if (delta > 180)  delta -= 360;
          if (delta < -180) delta += 360;
          totalRotation += delta;
          lastAngle = newAngle;
          updateKnobRotation(totalRotation);
          let rpm = Math.round(baseRPM + totalRotation * 5);
          rpm = Math.max(0, Math.min(8000, rpm));
          setText("rpm", rpm);
          sendRPMToServer(rpm);
        }
        function endDrag() { isDragging = false; }

        knob.addEventListener("mousedown", startDrag);
        knob.addEventListener("touchstart", startDrag, { passive: false });
        document.addEventListener("mousemove", onDrag);
        document.addEventListener("touchmove", onDrag, { passive: false });
        document.addEventListener("mouseup", endDrag);
        document.addEventListener("touchend", endDrag);
      })();

      // -------- Kickoff --------
      updateTime();
      setInterval(updateTime, 1000);
      pollUpdate();
      setInterval(pollUpdate, POLL_MS);
    })();

    // Keep this if you want the alert text element immediately after the first icon
    document.addEventListener("DOMContentLoaded", () => {
      const icons = document.querySelector(".nav .icons");
      const firstIcon = icons?.querySelector(".icon:first-child");
      const alertEl = document.getElementById("alert-text");
      if (icons && firstIcon && alertEl && alertEl.parentElement !== icons) {
        firstIcon.insertAdjacentElement("afterend", alertEl);
      }
    });
    </script>


</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Home - Ecmo Simulator</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .box {
            width: 463px;
            height: 280px;
            border: 3px solid navy;
            border-bottom: none;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }

        .box button {
            width: 120px; /* Adjust width as needed */
            height: 100px; 
            background-color: blanchedalmond;
            color: navy; /* Text color */
            font-size: 16px; /* Adjust font size as needed */
            cursor: pointer; 
            top: 50px;
            border-radius: 15px; /* Applies a 15px radius to all corners */
            outline: 5px solid rgb(199, 68, 68);
        }


        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 1; /* Sit on top */
            left: 50%;
            top: 50%;
            width: 80%; /* Adjust as needed */
            height: 80%; /* Adjust as needed */
            overflow: auto; /* Enable scroll if needed */
            background-color: navy; /* Background color */
            transform: translate(-50%, -50%);
        }


        .modal-content {
            background-color: white;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 3px solid navy;
            width: 80%; /* Could be more or less, depending on screen size */
            text-align: center;
        }

        .close {
            color: navy;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: red;
            text-decoration: none;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 469px;
            height: 67px;
        }

        td {
            border: 3px solid navy; /* 3px */
            padding: 5px; /* 15px */
            text-align: left;
            position: relative;
            height: 40px; /* 120px */
        }
        .icon {
            font-size: 18px; /* 18px */
            cursor: pointer;
            position: relative;
            top: 0px

        }
        .nav .icons .icon:nth-child(2) i {
            transform: translateX(278px);
        }
        .icon:nth-child(2)::before {
            content: '';
            position: absolute;
            top: -10px; /* -10px */
            left: -15px; /* -15px */
            width: 2px; /* 2px */
            height: 37px;
            background-color: white;
            transform: translateX(278px);

        }

        .icon:nth-child(2)::after {
            content: '';
            position: absolute;
            top: -10px; /* -10px */
            right: -15px; /* -15px */
            width: 2px; /* 2px */
            height: 37px;
            background-color: rgb(255, 255, 255);
            transform: translateX(278px);

        }

    </style>
</head>
<body>
    <div class="nav">
        <div class="icons">
            <span class="icon"><i class="fa-solid fa-lungs"></i></span>
            <span class="icon"><i class="fa-solid fa-lock"></i></span>
        </div>
        <div class="time" id="current-time"></div>
    </div>
    <!-- <div style="position:absolute; top:0; left:0; width:800px; height:400px; background-color:rgba(255, 0, 0, 0.163); z-index:-1;"></div> -->

    <div class="content">
        <div class="container">
            <div class="box">
                <button onclick="location.href='/admin'">CLICK TO USE AS ADMIN</button>
            </div>
            <div class="side-buttons">
                <div class="connected-buttons">
                    <button onclick="location.href='/'"><i class="fas fa-home"></i></button>
                    <button onclick="location.href='/dashboard'"><i class="fa-solid fa-grip"></i></button>
                </div>
                <button class="circle-button" onclick="showPopup('Alert')"><i class="fa-solid fa-s"></i><i class="fa-solid fa-triangle-exclamation"></i></button>
                <button class="circle-button disabled" disabled><i class="fa-solid fa-link"></i></button>
                <button class="rect-button" onclick="showPopup('Battery')"><i class="fa-solid fa-battery-full"></i></button>
            </div>
            <table>
                <tr class="last-row">
                    <td><button onclick="location.href='/'"><i class="fas fa-home"></i></button></td>
                    <td><button onclick="location.href='/dashboard'"><i class="fa-solid fa-table-cells-large"></i></button></td>
                    <td><button class="disabled" disabled><i class="fa-solid fa-vials"></i></button></td>
                    <td><button class="disabled" disabled><i class="fa-solid fa-truck-medical"></i></button></td>
                    <td><button class="disabled" disabled><i class="fa-solid fa-link"></i></button></td>
                    <td><button class="disabled" disabled><i class="fa-regular fa-clock"></i></button></td>
                </tr>
            </table>
        </div>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <div id="modal-text"></div>
        </div>
    </div>

    <div class="circle-container">
        <div class="circle">
        CARDIOHELP
        <div class="marker"></div>
        </div>
    </div>

    <script>
        function showPopup(message) {
            document.getElementById('modal-text').innerText = message + ' Information';
            document.getElementById('myModal').style.display = "block";
        }

        function updateTime() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('current-time').innerText = now.toLocaleTimeString([], options);
        }

        setInterval(updateTime, 1000); // Update time every second
        function closePopup() {
            document.getElementById('myModal').style.display = "none";
        }
    </script>
</body>
</html>
